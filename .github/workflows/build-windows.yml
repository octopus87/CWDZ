name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "**.py"
      - "requirements.txt"
      - "build/**"
      - "config/**"
      - "cwdz/**"
      - ".github/workflows/build-windows.yml"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and Chromium
        shell: pwsh
        run: |
          python -m pip install -q -r requirements.txt
          python -m playwright install chromium

      - name: PyInstaller build
        shell: cmd
        run: pyinstaller build\cwdz.spec --noconfirm --clean

      - name: Bundle Playwright browsers
        shell: pwsh
        run: |
          $dist = "$env:GITHUB_WORKSPACE\dist\CWDZ"
          $pw = "$env:LOCALAPPDATA\ms-playwright"
          if (Test-Path $pw) {
            Remove-Item -Recurse -Force "$dist\ms-playwright" -ErrorAction SilentlyContinue
            Copy-Item -Recurse $pw "$dist\ms-playwright"
          } else {
            Write-Error "Playwright cache not found at $pw"
          }
          New-Item -ItemType Directory -Force -Path "$dist\data\.auth","$dist\data\downloads","$dist\data\output\vouchers" | Out-Null

      - name: Create release zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\CWDZ" -DestinationPath "dist\CWDZ-Windows-x64.zip" -Force
          Get-Item "dist\CWDZ-Windows-x64.zip" | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: CWDZ-Windows-x64
          path: dist/CWDZ-Windows-x64.zip
          retention-days: 14
