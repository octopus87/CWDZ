# 停简单平台配置（请勿将密码提交到版本库，本地使用 config/local.yaml 覆盖）
tingsimple:
  base_url: "https://open.tingjiandan.com/bmp-web/"
  login_url: "https://open.tingjiandan.com/bmp-web/"
  download_dir: "data/downloads"

# 科拓平台
keytop:
  login_url: "https://park.keytop.cn/unityp/login"
  download_dir: "data/downloads/keytop"
  auth_state_path: "data/.auth/keytop.json"
  qr_expire_days: 30
  login_timeout: 180

# 对账与凭证（路径均相对数据根目录：Windows 默认 D:/CWDZ，macOS 为程序目录）
reconcile:
  input_dir: "data/downloads"
  output_dir: "data/output"

voucher:
  output_dir: "data/output/vouchers"
  tingsimple:
    account_mapping_path: "config/voucher/tingsimple/account_mapping.xlsx"
    unsettled_template_path: "config/voucher/tingsimple/unsettled_template.xlsx"
    fee_template_path: "config/voucher/tingsimple/fee_template.xlsx"
    bank_template_path: "config/voucher/tingsimple/bank_template.xlsx"
    output_dir: "data/output/vouchers/tingsimple"
  keytop:
    account_mapping_path: "config/voucher/keytop/account_mapping.xlsx"
    fee_template_path: "config/voucher/keytop/fee_template.xlsx"
    withdrawal_template_path: "config/voucher/keytop/withdrawal_template.xlsx"
    output_dir: "data/output/vouchers/keytop"

# 下载方式: api（推荐）或 browser
download:
  mode: api

# 验证码识别
captcha:
  auto_ocr: true
  max_retries: 3

# 浏览器自动化（验证码在程序界面显示，可后台运行浏览器）
browser:
  headless: true
  timeout_ms: 60000
  auth_state_path: "data/.auth/state.json"
